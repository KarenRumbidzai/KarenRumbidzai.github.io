<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1c3a"/><stop offset="1" stop-color="#2b2e4a"/></linearGradient>
    <linearGradient id="aliasBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f72585"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
    <filter id="sh4" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="a4p" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#00c9a7"/></marker>
    <marker id="a4w" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#ffb703"/></marker>
    <marker id="a4b" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <text x="600" y="58" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">SSH Aliases: The Hidden Router</text>
  <text x="600" y="94" text-anchor="middle" fill="#b6b8d8" font-size="20">git@github-work … isn't a host — it's a shortcut your SSH config translates</text>
  <g filter="url(#sh4)"><rect x="60" y="160" width="330" height="90" rx="14" fill="#0d1117" stroke="#f72585" stroke-width="3"/></g>
  <text x="80" y="195" fill="#b6b8d8" font-size="16">you type:</text>
  <text x="80" y="228" fill="#ff8fc7" font-size="21" font-weight="bold" font-family="Consolas, monospace">git@github-work:org/repo.git</text>
  <g filter="url(#sh4)"><rect x="60" y="300" width="330" height="90" rx="14" fill="#0d1117" stroke="#f72585" stroke-width="3"/></g>
  <text x="80" y="335" fill="#b6b8d8" font-size="16">or:</text>
  <text x="80" y="368" fill="#ff8fc7" font-size="21" font-weight="bold" font-family="Consolas, monospace">git@github-personal:me/repo.git</text>
  <g filter="url(#sh4)"><rect x="500" y="130" width="280" height="300" rx="18" fill="#16162e" stroke="#8b5cf6" stroke-width="3"/></g>
  <text x="640" y="166" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="bold">~/.ssh/config</text>
  <text x="640" y="194" text-anchor="middle" fill="#8ea2c9" font-size="15" font-family="Consolas, monospace">the alias router</text>
  <rect x="525" y="215" width="230" height="88" rx="10" fill="url(#aliasBox)"/>
  <text x="540" y="246" fill="#2d001f" font-size="18" font-weight="bold" font-family="Consolas, monospace">Host github-work</text>
  <text x="540" y="271" fill="#ffd6ec" font-size="15" font-family="Consolas, monospace">IdentityFile id_ed25519_work</text>
  <text x="540" y="293" fill="#ffd6ec" font-size="15" font-family="Consolas, monospace">IdentitiesOnly yes</text>
  <rect x="525" y="320" width="230" height="88" rx="10" fill="url(#aliasBox)" opacity="0.85"/>
  <text x="540" y="351" fill="#2d001f" font-size="18" font-weight="bold" font-family="Consolas, monospace">Host github-personal</text>
  <text x="540" y="376" fill="#ffd6ec" font-size="15" font-family="Consolas, monospace">IdentityFile id_ed25519_personal</text>
  <text x="540" y="398" fill="#ffd6ec" font-size="15" font-family="Consolas, monospace">IdentitiesOnly yes</text>
  <g filter="url(#sh4)"><circle cx="990" cy="230" r="80" fill="#0d1117" stroke="#58a6ff" stroke-width="4"/></g>
  <g transform="translate(990 224)"><path d="M -36 -16 L -40 -42 L -16 -27 Z" fill="#fff"/><path d="M 36 -16 L 40 -42 L 16 -27 Z" fill="#fff"/><ellipse cx="0" cy="6" rx="40" ry="32" fill="#fff"/><circle cx="-15" cy="-1" r="5" fill="#0d1117"/><circle cx="15" cy="-1" r="5" fill="#0d1117"/></g>
  <text x="990" y="345" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="bold">github.com</text>
  <text x="990" y="372" text-anchor="middle" fill="#b6b8d8" font-size="15">GitHub only ever sees</text>
  <text x="990" y="394" text-anchor="middle" fill="#b6b8d8" font-size="15">one hostname</text>
  <path d="M 390 205 C 440 205, 460 230, 500 250" fill="none" stroke="#f72585" stroke-width="3" marker-end="url(#a4b)"/>
  <path d="M 390 345 C 440 345, 460 350, 500 355" fill="none" stroke="#f72585" stroke-width="3" marker-end="url(#a4b)"/>
  <path d="M 755 259 C 830 250, 860 240, 906 233" fill="none" stroke="#ffb703" stroke-width="3.5" marker-end="url(#a4w)"/>
  <path d="M 755 364 C 830 350, 860 262, 908 240" fill="none" stroke="#00c9a7" stroke-width="3.5" stroke-dasharray="7 6" marker-end="url(#a4p)"/>
  <text x="835" y="205" text-anchor="middle" fill="#ffb703" font-size="16" font-weight="bold" font-family="Consolas, monospace">work key</text>
  <text x="840" y="330" text-anchor="middle" fill="#00c9a7" font-size="16" font-weight="bold" font-family="Consolas, monospace">personal key</text>
  <g filter="url(#sh4)"><rect x="60" y="455" width="720" height="130" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/></g>
  <text x="80" y="486" fill="#8b949e" font-size="15" font-family="Consolas, monospace"># every alias quietly becomes github.com …</text>
  <text x="80" y="513" fill="#79c0ff" font-size="16" font-family="Consolas, monospace">Host github-work  →  HostName github.com</text>
  <text x="80" y="539" fill="#79c0ff" font-size="16" font-family="Consolas, monospace">Host github-personal  →  HostName github.com</text>
  <text x="80" y="568" fill="#7ee787" font-size="16" font-family="Consolas, monospace">… while forcing the matching key. Same host, different identities.</text>
  <text x="985" y="500" text-anchor="middle" fill="#8b949e" font-size="16">"Where did</text>
  <text x="985" y="524" text-anchor="middle" fill="#8b949e" font-size="16">github-work</text>
  <text x="985" y="548" text-anchor="middle" fill="#8b949e" font-size="16">come from?"</text>
  <text x="985" y="578" text-anchor="middle" fill="#c4b5fd" font-size="17" font-weight="bold">Your SSH config.</text>
</svg>